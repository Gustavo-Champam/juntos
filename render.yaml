services:
  - type: web
    name: juntos-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev --workspace @juntos/api --workspace @juntos/contracts && npm --workspace @juntos/api run build
    startCommand: npm --workspace @juntos/api run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: juntos-db
          property: connectionString
      - key: WEB_ORIGIN
        sync: false
      - key: INTERNAL_PROXY_KEY
        generateValue: true
    buildFilter:
      paths:
        - apps/api/**
        - packages/contracts/**
        - package.json
        - package-lock.json

databases:
  - name: juntos-db
    databaseName: juntos
    user: juntos
    plan: free
